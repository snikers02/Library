name: CI Pipeline

# Визначаємо, коли запускати конвеєр
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантажуємо код із репозиторію
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Налаштовуємо Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3. Встановлюємо залежності
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Статичний аналіз коду (Linting)
      - name: Lint with flake8
        run: |
          # зупиняємо збірку, якщо є помилки синтаксису або невизначені змінні
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # попередження для всього іншого (можна налаштувати суворіше)
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. Запуск юніт-тестів
      - name: Run tests with pytest
        run: |
          python -m pytest

      # 6. Тестова збірка Docker-образу
      - name: Build Docker image
        run: |
          docker build -t library-app:latest .
